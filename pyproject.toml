[project]
name = "wanwan-teacher-helper"
version = "0.3.3"
description = "Offline file assistant for kindergarten teachers"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "defusedxml==0.7.1",
    "lxml==6.1.3",
    "openpyxl==3.1.5",
    "pillow==12.3.0",
    "pypdf==6.19.0",
    "PySide6==6.11.2",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "xlrd==2.0.2",
    "xlsxwriter==3.2.9",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "ruff==0.16.8",
]
build = [
    "pyinstaller==6.22.3",
    "setuptools==84.0.0",
]

[tool.uv]
package = false
default-groups = ["dev", "build"]
# Preserve every transitive/platform-specific pin from requirements-lock.txt.
constraint-dependencies = [
    "altgraph==0.17.5",
    "et_xmlfile==2.0.0",
    "iniconfig==2.3.0",
    "macholib==1.16.4; sys_platform == \"darwin\"",
    "packaging==26.3",
    "pluggy==1.6.0",
    "Pygments==2.21.0",
    "pyinstaller-hooks-contrib==2026.7",
    "PySide6_Addons==6.11.2",
    "PySide6_Essentials==6.11.2",
    "shiboken6==6.11.2",
    "typing_extensions==4.16.0",
    "pefile==2024.8.26; sys_platform == \"win32\"",
    "pywin32-ctypes==0.2.3; sys_platform == \"win32\"",
    "colorama==0.4.6; sys_platform == \"win32\"",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
